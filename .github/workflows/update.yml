name: update-tw-stocks
on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py --no-open
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add index.html history.json
          git diff --cached --quiet || (git commit -m "update $(date -u +%F)" && git push)
