const KEY="tw_leaders_v1";let DATA=[];
const $=id=>document.getElementById(id);
function parseCSV(t){
  const rows=[];
  t.replace(/^\uFEFF/,"").split(/\r?\n/).forEach(l=>{
    if(!l.trim())return;
    const c=[];let cur="",q=false;
    for(const ch of l){if(ch=='"')q=!q;else if(ch==","&&!q){c.push(cur.trim());cur=""}else cur+=ch}
    c.push(cur.trim());rows.push(c);
  });
  return rows.map(r=>({code:r[0],name:r[1],sector:r[2],cap:parseFloat((r[3]||"").replace(/,/g,"")),chg:parseFloat((r[4]||"").replace(/[,%+]/g,"")),tv:parseFloat((r[5]||"").replace(/,/g,""))||0}))
    .filter(r=>r.code&&r.sector&&isFinite(r.cap)&&isFinite(r.chg));
}
function load(text,label){
  const d=parseCSV(text);
  if(!d.length){alert("讀不到有效資料,請確認欄位順序與格式");return}
  DATA=d;
  try{localStorage.setItem(KEY,JSON.stringify({d,label,t:new Date().toLocaleString("zh-TW")}))}catch(e){}
  $("meta").textContent=`${label}・共 ${d.length} 檔・${new Set(d.map(x=>x.sector)).size} 個族群`;
  $("imp").open=false;render();
}
const fmtC=n=>n>=10000?(n/10000).toFixed(2)+" 兆":n.toLocaleString("zh-TW",{maximumFractionDigits:0})+" 億";
const cls=v=>v>0?"up":v<0?"dn":"";
const fmtP=v=>(v>0?"+":"")+v.toFixed(2)+"%";
function render(){
  const g={};
  DATA.forEach(r=>(g[r.sector]??=[]).push(r));
  const FL=(typeof EMBED!=="undefined"&&EMBED.flow)||null;
  const totalTv=DATA.reduce((p,c)=>p+(c.tv||0),0);
  let secs=Object.entries(g).map(([s,a])=>{
    a.sort((x,y)=>y.cap-x.cap);
    const tot=a.reduce((p,c)=>p+c.cap,0);
    const avg=a.reduce((p,c)=>p+c.chg,0)/a.length;
    const tv=a.reduce((p,c)=>p+(c.tv||0),0);
    const share=totalTv?tv/totalTv*100:0;
    const pv=FL&&FL.s&&FL.s[s];
    const tvChg=pv&&pv[0]>0?(tv/pv[0]-1)*100:null;
    const shChg=pv?share-pv[1]:null;
    return{s,a,tot,avg,tv,share,tvChg,shChg};
  });
  const m=$("ss").value;
  const kw=$("q").value.trim().toLowerCase();
  const hit=r=>kw&&(r.code+" "+r.name).toLowerCase().includes(kw);
  secs.sort((x,y)=>m=="flow"?y.tv-x.tv:m=="chg"?y.avg-x.avg:m=="cap"?y.tot-x.tot:x.s.localeCompare(y.s,"zh-Hant"));
  secs.forEach((x,k)=>x.rank=k+1);
  const mx=Math.max(...secs.map(x=>x.share),0.0001);
  const view=kw?secs.filter(x=>x.a.some(hit)):secs;
  const nHit=kw?view.reduce((p,x)=>p+x.a.filter(hit).length,0):0;
  $("flowinfo").textContent=(kw?"搜尋「"+$("q").value.trim()+"」:找到 "+nHit+" 檔個股,位於 "+view.length+" 個族群。":"")+(totalTv?"全市場上市個股成交金額 "+fmtC(totalTv)+(FL&&FL.prevDate?"・資金增減與 "+FL.prevDate+" 比較":"・尚無前一交易日資料,資金增減將從下一個交易日開始顯示"):"");
  $("out").innerHTML=view.map(({s,a,tot,avg,tv,share,tvChg,shChg,rank})=>{
    const body=a.map((r,i)=>`<tr class="${(["boss","boss2","boss3"][i]||"")+(hit(r)?" hit":"")}"><td>${i+1}</td><td>${esc(r.code)}</td><td>${esc(r.name)}${i<3?`<span class="badge b${i+1}">${["大哥","二哥","三哥"][i]}</span>`:""}</td><td>${fmtC(r.cap)}</td><td>${r.tv?fmtC(r.tv):"-"}</td><td class="${cls(r.chg)}">${fmtP(r.chg)}</td></tr>`).join("");
    const fl=tvChg===null?'<span class="sub">資金增減:無前一日資料</span>':`<span class="${cls(tvChg)}">${tvChg>=0?"▲ 資金增加":"▼ 資金減少"} ${fmtP(tvChg)}</span><span class="sub">占比 ${shChg>=0?"+":""}${shChg.toFixed(2)}pp</span>`;

  }).join("")||'<div class="empty">'+(kw?'找不到符合的個股':'沒有資料')+'</div>';
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
