<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台股族群大哥榜</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e5e7eb;--up:#d92d20;--dn:#039855;--gold:#b7791f;--goldbg:#fef3c7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#181c22;--tx:#e8eaed;--mut:#9aa3af;--bd:#2a2f37;--up:#ff6b5e;--dn:#34d399;--gold:#fbbf24;--goldbg:#3a2f0b}}
:root[data-theme="dark"]{--bg:#0f1216;--card:#181c22;--tx:#e8eaed;--mut:#9aa3af;--bd:#2a2f37;--up:#ff6b5e;--dn:#34d399;--gold:#fbbf24;--goldbg:#3a2f0b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
.sub{color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.bar input[type=search],.bar select{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.bar input[type=search]{flex:1;min-width:160px}
button,.btn{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
textarea{width:100%;height:90px;box-sizing:border-box;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);padding:8px;font:12px monospace}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:12px}
summary{cursor:pointer;font-weight:600}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:12px 0;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:7px 14px;text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:500}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
tr+tr td{border-top:1px solid var(--bd)}
.boss td{background:var(--goldbg)}
.badge{display:inline-block;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--gold);color:#fff;font-size:12px}
.up{color:var(--up)}.dn{color:var(--dn)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.boss2 td{background:rgba(148,163,184,.18)}.boss3 td{background:rgba(217,119,6,.14)}
.badge.b2{background:#64748b}.badge.b3{background:#b45309}
.fl{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:6px 14px;font-size:13px;border-bottom:1px solid var(--bd)}
.meter{flex:1;min-width:120px;height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.meter i{display:block;height:100%;background:var(--gold)}
.hit td{background:rgba(59,130,246,.25)!important;font-weight:700}
.bar input[type=search]{flex:1;min-width:200px}
</style>
</head>
<body>
<main>
<h1>👑 台股族群大哥榜</h1>
<div class="sub" id="meta">尚未載入資料</div>

<details id="imp">
<summary>匯入今日資料</summary>
<p class="sub">格式(CSV):代號,名稱,族群,市值(億),漲跌幅(%)。資料由 build.py 每天自動產生;也可在此手動上傳或貼上。</p>
<textarea id="ta" placeholder="2330,台積電,半導體,150000,1.25"></textarea>
<div class="bar" style="margin-bottom:0">
<button id="go">載入貼上的資料</button>
<label class="btn">上傳 CSV<input id="file" type="file" accept=".csv,.txt" hidden></label>
<button id="demo">示意資料(虛構)</button>
</div>
</details>

<div class="bar">
<input type="search" id="q" placeholder="搜尋個股代號或名稱,例如 2330 或 台積">
<select id="ss">
<option value="flow">族群排序:資金占比</option>
<option value="chg">族群排序:平均漲幅</option>
<option value="cap">族群排序:總市值</option>
<option value="name">族群排序:名稱</option>
</select>
</div>
<div class="sub" id="flowinfo" style="margin-bottom:6px"></div>
<div id="out"><div class="empty">請先匯入資料</div></div>
</main>
<script>
/*EMBED*/
const KEY="tw_leaders_v1";let DATA=[];
const $=id=>document.getElementById(id);
function parseCSV(t){
  const rows=[];
  t.replace(/^\uFEFF/,"").split(/\r?\n/).forEach(l=>{
    if(!l.trim())return;
    const c=[];let cur="",q=false;
    for(const ch of l){if(ch=='"')q=!q;else if(ch==","&&!q){c.push(cur.trim());cur=""}else cur+=ch}
    c.push(cur.trim());rows.push(c);
  });
  return rows.map(r=>({code:r[0],name:r[1],sector:r[2],cap:parseFloat((r[3]||"").replace(/,/g,"")),chg:parseFloat((r[4]||"").replace(/[,%+]/g,"")),tv:parseFloat((r[5]||"").replace(/,/g,""))||0}))
    .filter(r=>r.code&&r.sector&&isFinite(r.cap)&&isFinite(r.chg));
}
function load(text,label){
  const d=parseCSV(text);
  if(!d.length){alert("讀不到有效資料,請確認欄位順序與格式");return}
  DATA=d;
  try{localStorage.setItem(KEY,JSON.stringify({d,label,t:new Date().toLocaleString("zh-TW")}))}catch(e){}
  $("meta").textContent=`${label}・共 ${d.length} 檔・${new Set(d.map(x=>x.sector)).size} 個族群`;
  $("imp").open=false;render();
}
const fmtC=n=>n>=10000?(n/10000).toFixed(2)+" 兆":n.toLocaleString("zh-TW",{maximumFractionDigits:0})+" 億";
const cls=v=>v>0?"up":v<0?"dn":"";
const fmtP=v=>(v>0?"+":"")+v.toFixed(2)+"%";
function render(){
  const g={};
  DATA.forEach(r=>(g[r.sector]??=[]).push(r));
  const FL=(typeof EMBED!=="undefined"&&EMBED.flow)||null;
  const totalTv=DATA.reduce((p,c)=>p+(c.tv||0),0);
  let secs=Object.entries(g).map(([s,a])=>{
    a.sort((x,y)=>y.cap-x.cap);
    const tot=a.reduce((p,c)=>p+c.cap,0);
    const avg=a.reduce((p,c)=>p+c.chg,0)/a.length;
    const tv=a.reduce((p,c)=>p+(c.tv||0),0);
    const share=totalTv?tv/totalTv*100:0;
    const pv=FL&&FL.s&&FL.s[s];
    const tvChg=pv&&pv[0]>0?(tv/pv[0]-1)*100:null;
    const shChg=pv?share-pv[1]:null;
    return{s,a,tot,avg,tv,share,tvChg,shChg};
  });
  const m=$("ss").value;
  const kw=$("q").value.trim().toLowerCase();
  const hit=r=>kw&&(r.code+" "+r.name).toLowerCase().includes(kw);
  secs.sort((x,y)=>m=="flow"?y.tv-x.tv:m=="chg"?y.avg-x.avg:m=="cap"?y.tot-x.tot:x.s.localeCompare(y.s,"zh-Hant"));
  secs.forEach((x,k)=>x.rank=k+1);
  const mx=Math.max(...secs.map(x=>x.share),0.0001);
  const view=kw?secs.filter(x=>x.a.some(hit)):secs;
  const nHit=kw?view.reduce((p,x)=>p+x.a.filter(hit).length,0):0;
  $("flowinfo").textContent=(kw?"搜尋「"+$("q").value.trim()+"」:找到 "+nHit+" 檔個股,位於 "+view.length+" 個族群。":"")+(totalTv?"全市場上市個股成交金額 "+fmtC(totalTv)+(FL&&FL.prevDate?"・資金增減與 "+FL.prevDate+" 比較":"・尚無前一交易日資料,資金增減將從下一個交易日開始顯示"):"");
  $("out").innerHTML=view.map(({s,a,tot,avg,tv,share,tvChg,shChg,rank})=>{
    const body=a.map((r,i)=>`<tr class="${(["boss","boss2","boss3"][i]||"")+(hit(r)?" hit":"")}"><td>${i+1}</td><td>${esc(r.code)}</td><td>${esc(r.name)}${i<3?`<span class="badge b${i+1}">${["大哥","二哥","三哥"][i]}</span>`:""}</td><td>${fmtC(r.cap)}</td><td>${r.tv?fmtC(r.tv):"-"}</td><td class="${cls(r.chg)}">${fmtP(r.chg)}</td></tr>`).join("");
    const fl=tvChg===null?'<span class="sub">資金增減:無前一日資料</span>':`<span class="${cls(tvChg)}">${tvChg>=0?"▲ 資金增加":"▼ 資金減少"} ${fmtP(tvChg)}</span><span class="sub">占比 ${shChg>=0?"+":""}${shChg.toFixed(2)}pp</span>`;
    return`<section class="sec"><div class="sh"><span>#${rank} ${esc(s)} <span class="sub">${a.length} 檔・市值 ${fmtC(tot)}</span></span><span class="${cls(avg)}">平均 ${fmtP(avg)}</span></div><div class="fl"><span>資金占比 <b>${share.toFixed(2)}%</b></span><span class="meter"><i style="width:${share/mx*100}%"></i></span><span>成交 ${fmtC(tv)}</span>${fl}</div><div class="scroll"><table><tr><th>排名</th><th>代號</th><th>名稱</th><th>市值</th><th>成交金額</th><th>漲跌幅</th></tr>${body}</table></div></section>`;
  }).join("")||'<div class="empty">'+(kw?'找不到符合的個股':'沒有資料')+'</div>';
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
$("go").onclick=()=>load($("ta").value,"貼上資料");
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(r.result,f.name);r.readAsText(f,"utf-8")};
$("demo").onclick=()=>load(`甲001,示意A公司,示意族群一,5000,1.2
甲002,示意B公司,示意族群一,1200,-0.8
甲003,示意C公司,示意族群一,300,2.5
乙001,示意D公司,示意族群二,800,-1.1
乙002,示意E公司,示意族群二,2600,0.4`,"示意資料(虛構,非真實行情)");
$("ss").onchange=render;$("q").oninput=render;

try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.d){DATA=s.d;$("meta").textContent=`${s.label}・上次載入 ${s.t}・共 ${s.d.length} 檔`;$("imp").open=false;render()}}catch(e){}

if(typeof EMBED!=="undefined")load(EMBED.csv,"證交所收盤資料・"+EMBED.date);
else if(!DATA.length){$("meta").textContent="尚未產生資料,請執行 build.py,或手動匯入";$("imp").open=true}
</script>
</body>
</html>
